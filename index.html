<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>제주 여행 플래너</title>
<style>
:root{
  --primary:#2D9CDB;--primary-light:#5FBBEF;--primary-dark:#1B7CB8;
  --orange:#FF7A45;--green:#27AE60;--purple:#9B59B6;
  --bg:#F5FAFC;--card:#FFFFFF;--text:#1E2A32;--sub:#7C8B93;--border:#E4EEF2;
  --day1:#FF7A45;--day1b:#C75A2E;--day2:#2D9CDB;--day2b:#1B5E8A;--day3:#27AE60;--day3b:#1D8449;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#2D9CDB 0%,#1B7CB8 60%,#27AE60 130%);padding:14px 16px 12px;position:sticky;top:0;z-index:300;box-shadow:0 4px 20px rgba(45,156,219,.35)}
.header h1{color:#fff;font-size:17px;font-weight:800;letter-spacing:-.3px}
.header p{color:rgba(255,255,255,.85);font-size:11px;margin-top:3px}

/* FILTER BARS */
.bar{background:#fff;padding:10px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.bar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--sub);transition:.15s;white-space:nowrap}
.chip.active{color:#fff;border-color:transparent}
.chip[data-cat="all"].active{background:var(--text)}
.chip[data-cat="food"].active{background:var(--orange)}
.chip[data-cat="view"].active{background:var(--primary)}
.chip[data-cat="play"].active{background:var(--green)}
.chip[data-cat="etc"].active{background:var(--purple)}
.route-bar .chip.active{background:var(--text2,#333)}
.route-bar .chip.off.active{background:var(--sub)}

/* MAP */
#map{width:100%;height:calc(100vh - 178px);background:#DDEAF0}
.legend{position:absolute;right:10px;bottom:78px;z-index:400;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:11px;max-width:150px;display:none}
.legend.show{display:block}
.legend h4{font-size:11px;font-weight:800;margin-bottom:6px}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11px;color:var(--sub)}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* BOTTOM NAV */
.nav{display:flex;justify-content:space-around;background:#fff;position:fixed;bottom:0;left:0;right:0;z-index:300;border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--sub);font-size:10px;font-weight:700;padding:4px 20px;border:none;background:none}
.nav-btn.active{color:var(--primary)}
.nav-btn .ni{font-size:20px}

.tab{display:none}.tab.active{display:block}

/* LIST TAB */
.section{padding:14px;max-width:700px;margin:0 auto;padding-bottom:80px}
.spot-card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;gap:12px;cursor:pointer;border:1px solid var(--border)}
.spot-card img{width:88px;height:88px;object-fit:cover;flex-shrink:0}
.spot-card-body{padding:10px 10px 10px 0;flex:1;min-width:0}
.spot-name{font-size:14px;font-weight:800}
.spot-tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;padding:2px 8px;border-radius:8px;margin:3px 0}
.spot-tag.food{background:var(--orange)}.spot-tag.view{background:var(--primary)}.spot-tag.play{background:var(--green)}.spot-tag.etc{background:var(--purple)}
.spot-desc{font-size:11px;color:var(--sub);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:none}
.modal-backdrop.show{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:901;max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:24px}
.modal.show{transform:translateY(0)}
.modal img{width:100%;height:200px;object-fit:cover}
.modal-body{padding:16px 18px}
.modal-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;font-size:16px;z-index:2}
.modal-name{font-size:18px;font-weight:800;margin:4px 0 8px}
.modal-desc{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:12px}
.caution-box{background:#FFF4E5;border:1px solid #FFD9A0;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;color:#8A5A00;margin-bottom:14px}
.caution-box b{display:block;margin-bottom:3px}
.modal-link{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;padding:12px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none}

.order-badge{position:absolute;top:-6px;left:-6px;background:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* GATE */
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#2D9CDB 0%,#1B7CB8 60%,#27AE60 130%);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:#fff;border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.gate-q{font-size:20px;font-weight:800;color:var(--text);line-height:1.6;margin-bottom:20px}
.gate-q b{color:var(--primary)}
.gate-blank{width:38px;height:44px;border:2px solid var(--border);border-radius:10px;font-size:22px;text-align:center;font-weight:800;color:var(--primary);margin:0 3px;vertical-align:middle}
.gate-blank:focus{outline:none;border-color:var(--primary)}
.gate-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:16px;text-align:center;margin-bottom:12px}
.gate-input:focus{outline:none;border-color:var(--primary)}
.gate-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.gate-btn:active{opacity:.8}
.gate-error{color:#E74C3C;font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
</style>
</head>

<div id="gate">

    <div class="gate-q">시작하시려면 아래 빈칸을 채우시오.<br><br><span style="font-size:26px">나는 이범식을 <input type="text" class="gate-blank" id="gateBlank1" maxlength="1" autocomplete="off"><input type="text" class="gate-blank" id="gateBlank2" maxlength="1" autocomplete="off"> 한다</span></div>
    <button class="gate-btn" id="gateBtn">입장하기</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div id="appRoot" style="display:none">

<div class="header">
  <h1>🍊 제주 여행 플래너</h1>
  <p>스팟을 눌러 상세정보를 보고, 아래에서 일자별 동선을 선택하세요</p>
</div>

<div class="bar cat-bar">

  <div class="chip" data-cat="food">🍽 맛집</div>
  <div class="chip" data-cat="view">🌅 풍경</div>
  <div class="chip" data-cat="play">🎡 놀거리</div>
  <div class="chip" data-cat="etc">✨ 기타</div>
</div>

<div class="bar route-bar">
  <div class="chip off active" data-route="off">동선 끄기</div>
</div>

<div class="tab active" id="tab-map" style="position:relative">
  <div id="map"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="tab section" id="tab-list"></div>

<div class="nav">
  <button class="nav-btn active" data-tab="map"><span class="ni">🗺️</span>지도</button>
  <button class="nav-btn" data-tab="list"><span class="ni">📋</span>목록</button>
</div>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">✕</button>
  <div id="modalContent"></div>
</div>

</div>

/* ====================================================================
   일자별 동선 — day, case 조합으로 여러 경로안을 정의합니다.
   spotIds 순서대로 선을 연결하고, 번호 배지를 표시합니다.
   아직 일정이 정해지지 않아 비워둠 — 1일차/2일차 장소가 정해지면 채웁니다.
   ==================================================================== */
var ROUTES = [];

var CAT_META = { food:{label:"맛집",cls:"food"}, view:{label:"풍경",cls:"view"}, play:{label:"놀거리",cls:"play"}, etc:{label:"기타",cls:"etc"} };
var CAT_COLOR = { food:"#FF7A45", view:"#2D9CDB", play:"#27AE60", etc:"#9B59B6" };

var map, markers = {}, currentPolyline = null, currentOrderMarkers = [], activeCat = "all", activeRoute = "off";

function loadNaverMapScript(){
  var s = document.createElement("script");
  s.src = "https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + NAVER_CLIENT_ID + "&submodules=geocoder&callback=initMap";
  s.onerror = function(){
    document.getElementById("map").innerHTML =
      '<div style="padding:24px;text-align:center;color:#7C8B93;font-size:13px">지도를 불러오지 못했습니다.<br>NAVER_CLIENT_ID 설정을 확인해주세요.</div>';
  };
  document.head.appendChild(s);
}

function initMap(){
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(33.38, 126.55),
    zoom: 10
  });
  geocodeAllSpots();
}

function geocodeAllSpots(){
  var bounds = new naver.maps.LatLngBounds();
  SPOTS.forEach(function(spot){
    naver.maps.Service.geocode({ query: spot.address }, function(status, response){
      if (status !== naver.maps.Service.Status.OK || !response.v2.addresses.length) {
        console.warn("주소를 찾지 못했습니다:", spot.name, spot.address);
        return;
      }
      var item = response.v2.addresses[0];
      spot.lat = parseFloat(item.y);
      spot.lng = parseFloat(item.x);
      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(spot.lat, spot.lng),
        map: map,
        icon: {
          content: '<div style="background:' + CAT_COLOR[spot.category] + ';width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff">' + iconFor(spot.category) + '</div>',
          anchor: new naver.maps.Point(13, 13)
        }
      });
      marker.setVisible(activeCat === "all" || spot.category === activeCat);
      naver.maps.Event.addListener(marker, "click", function(){ openModal(spot); });
      markers[spot.id] = marker;
      bounds.extend(marker.getPosition());
      map.fitBounds(bounds);
    });
  });
}

function iconFor(cat){
  return cat === "food" ? "🍽" : cat === "view" ? "🌅" : cat === "play" ? "🎡" : "✨";
}

function applyCategoryFilter(){
  Object.keys(markers).forEach(function(id){
    var spot = SPOTS.find(function(s){ return s.id === id; });
    var visible = activeCat === "all" || spot.category === activeCat;
    markers[id].setVisible(visible);
  });
}

function clearRoute(){
  if (currentPolyline) { currentPolyline.setMap(null); currentPolyline = null; }
  currentOrderMarkers.forEach(function(m){ m.setMap(null); });
  currentOrderMarkers = [];
  document.getElementById("legend").classList.remove("show");
}

function drawRoute(routeKey){
  clearRoute();
  if (routeKey === "off") return;
  var route = ROUTES.find(function(r){ return r.key === routeKey; });
  if (!route) return;
  var path = route.spotIds.map(function(id){
    var spot = SPOTS.find(function(s){ return s.id === id; });
    return new naver.maps.LatLng(spot.lat, spot.lng);
  });
  currentPolyline = new naver.maps.Polyline({
    map: map, path: path,
    strokeColor: cssVar(route.color), strokeWeight: 4, strokeOpacity: 0.85, strokeStyle: "solid"
  });
  route.spotIds.forEach(function(id, idx){
    var spot = SPOTS.find(function(s){ return s.id === id; });
    var om = new naver.maps.Marker({
      position: new naver.maps.LatLng(spot.lat, spot.lng), map: map, zIndex: 200,
      icon: {
        content: '<div style="background:' + cssVar(route.color) + ';color:#fff;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">' + (idx + 1) + '</div>',
        anchor: new naver.maps.Point(10, 10)
      }
    });
    naver.maps.Event.addListener(om, "click", function(){ openModal(spot); });
    currentOrderMarkers.push(om);
  });
  var bounds = new naver.maps.LatLngBounds();
  path.forEach(function(p){ bounds.extend(p); });
  map.fitBounds(bounds);

  var legend = document.getElementById("legend");
  legend.innerHTML = '<h4>' + route.label + '</h4>' + route.spotIds.map(function(id, idx){
    var spot = SPOTS.find(function(s){ return s.id === id; });
    return '<div class="legend-row"><span class="legend-dot" style="background:' + cssVar(route.color) + '"></span>' + (idx + 1) + '. ' + spot.name + '</div>';
  }).join("");
  legend.classList.add("show");
}

function cssVar(v){
  if (v.indexOf("var(") !== 0) return v;
  var name = v.slice(4, -1);
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function openModal(spot){
  var meta = CAT_META[spot.category];
  document.getElementById("modalContent").innerHTML =
    '<img src="' + spot.photo + '" alt="' + spot.name + '">' +
    '<div class="modal-body">' +
      '<span class="spot-tag ' + meta.cls + '">' + meta.label + '</span>' +
      '<div class="modal-name">' + spot.name + '</div>' +
      '<div class="modal-desc">' + spot.desc + '</div>' +
      '<div style="font-size:11px;color:var(--sub);margin-bottom:10px">📌 ' + spot.address + '</div>' +
      (spot.caution ? '<div class="caution-box"><b>⚠ 주의사항</b>' + spot.caution + '</div>' : '') +
      '<a class="modal-link" href="https://map.naver.com/v5/search/' + encodeURIComponent(spot.name + ' ' + spot.address) + '" target="_blank">📍 네이버지도로 길찾기</a>' +
      (spot.link ? '<a class="modal-link" style="background:var(--purple);margin-top:8px" href="' + spot.link + '" target="_blank">🔗 인스타그램 참고</a>' : '') +
    '</div>';
  document.getElementById("modalBackdrop").classList.add("show");
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
  document.getElementById("modal").classList.remove("show");
}

function renderList(){
  var filtered = SPOTS.filter(function(s){ return activeCat === "all" || s.category === activeCat; });
  document.getElementById("tab-list").innerHTML = filtered.map(function(spot){
    var meta = CAT_META[spot.category];
    return '<div class="spot-card" data-id="' + spot.id + '">' +
      '<img src="' + spot.photo + '" alt="' + spot.name + '">' +
      '<div class="spot-card-body">' +
        '<div class="spot-name">' + spot.name + '</div>' +
        '<span class="spot-tag ' + meta.cls + '">' + meta.label + '</span>' +
        '<div class="spot-desc">' + spot.desc + '</div>' +
      '</div>' +
    '</div>';
  }).join("");
}

function buildRouteBar(){
  var bar = document.querySelector(".route-bar");
  var byDay = {};
  ROUTES.forEach(function(r){ (byDay[r.day] = byDay[r.day] || []).push(r); });
  Object.keys(byDay).sort().forEach(function(day){
    byDay[day].forEach(function(r){
      var chip = document.createElement("div");
      chip.className = "chip";
      chip.dataset.route = r.key;
      chip.textContent = r.label;
      bar.appendChild(chip);
    });
  });
}

function startApp(){
  buildRouteBar();
  loadNaverMapScript();
  renderList();

  document.querySelectorAll(".cat-bar .chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      document.querySelectorAll(".cat-bar .chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      activeCat = chip.dataset.cat;
      applyCategoryFilter();
      renderList();
    });
  });

  document.querySelector(".route-bar").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    document.querySelectorAll(".route-bar .chip").forEach(function(c){ c.classList.remove("active"); });
    chip.classList.add("active");
    activeRoute = chip.dataset.route;
    drawRoute(activeRoute);
  });

  document.querySelectorAll(".nav-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  document.getElementById("tab-list").addEventListener("click", function(e){
    var card = e.target.closest(".spot-card");
    if (!card) return;
    var spot = SPOTS.find(function(s){ return s.id === card.dataset.id; });
    openModal(spot);
  });

  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", closeModal);
}

function checkGate(){
  var b1 = document.getElementById("gateBlank1");
  var b2 = document.getElementById("gateBlank2");
  var error = document.getElementById("gateError");
  var answer = (b1.value + b2.value).trim();
  if (answer === "사랑") {
    document.getElementById("gate").style.display = "none";
    document.getElementById("appRoot").style.display = "";
    startApp();
  } else {
    error.textContent = "틀렸습니다. 다시 입력해주세요.";
    b1.value = "";
    b2.value = "";
    b1.focus();
  }
}

document.addEventListener("DOMContentLoaded", function(){
  var b1 = document.getElementById("gateBlank1");
  var b2 = document.getElementById("gateBlank2");
  document.getElementById("gateBtn").addEventListener("click", checkGate);
  var composing = false;
  b1.addEventListener("compositionstart", function(){ composing = true; });
  b1.addEventListener("compositionend", function(){
    composing = false;
    b1.value = b1.value.slice(-1);
    if (b1.value) b2.focus();
  });
  b1.addEventListener("input", function(){
    if (composing) return;
    b1.value = b1.value.slice(-1);
    if (b1.value) b2.focus();
  });
  [b1, b2].forEach(function(el){
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter") checkGate();
    });
  });
  b1.focus();
});
</script>
</body>
</html>
